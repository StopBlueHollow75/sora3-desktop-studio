<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#7b61ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b61ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#7b61ff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Glow orbs -->
  <circle cx="240" cy="120" r="300" fill="url(#glow1)" />
  <circle cx="960" cy="260" r="250" fill="url(#glow2)" />

  <!-- Decorative grid lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#7b61ff" stroke-opacity="0.05" stroke-width="1" />
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#7b61ff" stroke-opacity="0.05" stroke-width="1" />
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#7b61ff" stroke-opacity="0.05" stroke-width="1" />
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#7b61ff" stroke-opacity="0.05" stroke-width="1" />

  <line x1="200" y1="0" x2="200" y2="360" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="1" />
  <line x1="400" y1="0" x2="400" y2="360" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="1" />
  <line x1="600" y1="0" x2="600" y2="360" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="1" />
  <line x1="800" y1="0" x2="800" y2="360" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="1" />
  <line x1="1000" y1="0" x2="1000" y2="360" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Decorative circles -->
  <circle cx="120" cy="300" r="40" fill="none" stroke="#7b61ff" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="1080" cy="60" r="55" fill="none" stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1" />
  <circle cx="1100" cy="80" r="25" fill="none" stroke="#7b61ff" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="80" cy="50" r="15" fill="none" stroke="#00d4ff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#lineGrad)" />

  <!-- Decorative path curves -->
  <path d="M0,280 C200,260 400,300 600,270 C800,240 1000,290 1200,265" fill="none" stroke="#7b61ff" stroke-opacity="0.06" stroke-width="1" />
  <path d="M0,310 C250,290 450,330 700,300 C900,275 1050,320 1200,295" fill="none" stroke="#00d4ff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Small dots -->
  <circle cx="350" cy="100" r="2" fill="#7b61ff" fill-opacity="0.3" />
  <circle cx="850" cy="280" r="2" fill="#00d4ff" fill-opacity="0.3" />
  <circle cx="150" cy="200" r="1.5" fill="#7b61ff" fill-opacity="0.2" />
  <circle cx="1050" cy="180" r="1.5" fill="#00d4ff" fill-opacity="0.2" />
  <circle cx="450" cy="300" r="1.5" fill="#7b61ff" fill-opacity="0.15" />
  <circle cx="750" cy="70" r="1.5" fill="#00d4ff" fill-opacity="0.15" />

  <!-- Headline -->
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="68.0" font-weight="bold" fill="#ffffff">
    Sora 3 Desktop App Without
  </text>

  <!-- Tagline -->
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" fill="#c9d1d9" font-size="20.7">
    Sora 3 Desktop Studio for video editors — manage local AI generation queues without limits.
  </text>

  <!-- Bottom accent -->
  <rect x="480" y="260" width="240" height="2" fill="url(#lineGrad)" />
</svg>